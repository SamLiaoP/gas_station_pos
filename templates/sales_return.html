<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>銷貨退回 - 加油站POS系統</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        body > .container {
            max-width: 95%;
            margin: 20px auto;
        }
        .filter-container {
            background-color: #f9f9f9;
            padding: 15px;
            border-radius: 5px;
            border: 1px solid #eee;
            margin-bottom: 20px;
        }
        .filter-container .form-row {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: flex-end; /* 讓按鈕和下拉選單底部對齊 */
        }
        .filter-container .form-group {
            flex: 1 1 auto; /* 讓元素自動分配空間 */
            min-width: 200px;
        }
        .filter-container label {
            display: block;
            margin-bottom: 5px;
        }
        .filter-container select,
        .filter-container input[type="text"],
        .filter-container button {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .filter-container button {
            background-color: #007bff;
            color: white;
            cursor: pointer;
            flex-basis: 150px; /* 給按鈕一個基礎寬度 */
            flex-grow: 0; /* 按鈕不擴展 */
        }
        .filter-container button:hover {
            background-color: #0056b3;
        }

        .sales-history-container {
            margin-top: 20px;
        }
        .sales-history-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9em;
        }
        .sales-history-table th, .sales-history-table td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        .sales-history-table th {
            background-color: #f0f0f0;
        }
        .sales-history-table .action-cell button {
            padding: 5px 10px;
            background-color: #28a745; /* 綠色 */
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
        }
        .sales-history-table .action-cell button:hover {
            background-color: #218838;
        }
        .reason-textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 16px;
            min-height: 60px;
            margin-top: 5px;
            box-sizing: border-box;
        }
        .form-buttons {
             margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>銷貨退回 (選擇銷售記錄進行整單退貨)</h1>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="flash-messages">
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }}">{{ message }}</div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        <div class="filter-container">
            <h3>篩選銷售記錄</h3>
            <div class="form-row">
                <div class="form-group">
                    <label for="filter_supplier_name">廠商:</label>
                    <select id="filter_supplier_name" name="filter_supplier_name">
                        <option value="">-- 所有廠商 --</option>
                        {% for sup_name in supplier_list %}
                            <option value="{{ sup_name }}">{{ sup_name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label for="filter_product_name">產品名稱:</label>
                    <input type="text" id="filter_product_name" name="filter_product_name" placeholder="輸入產品名稱關鍵字">
                </div>
                <div class="form-group">
                    <label for="filter_unit">單位:</label>
                    <input type="text" id="filter_unit" name="filter_unit" placeholder="輸入單位關鍵字">
                </div>
                <div class="form-group">
                    <button type="button" id="filter_button">查詢銷售記錄</button>
                </div>
            </div>
        </div>
        
        <form method="POST" action="{{ url_for('main_routes.sales_return') }}" id="salesReturnForm">
            <input type="hidden" id="original_transaction_id" name="original_transaction_id" value="">
            
            <div class="form-row" style="background-color: #f0f0f0; padding:15px; border-radius:5px; margin-bottom:20px;">
                 <div class="form-group" style="flex-basis: 40%;">
                    <label for="staff">處理員工 (必填):</label>
                    <select id="staff" name="staff" required>
                        <option value="">-- 請選擇員工 --</option>
                        {% for s_name in staff_list %}
                            <option value="{{ s_name }}">{{ s_name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group" style="flex-basis: 55%;">
                    <label for="reason">退貨原因 (選填):</label>
                    <textarea id="reason" name="reason" class="reason-textarea" placeholder="請輸入退貨原因..."></textarea>
                </div>
            </div>
        </form>

        <div class="sales-history-container">
            <h4>符合條件的銷售記錄 (最多顯示50筆，最新的在前)</h4>
            <div id="salesHistoryTableContainer">
                <p>請使用上方篩選條件查詢銷售記錄。</p>
            </div>
        </div>
        
        <div class="form-buttons">
            <button type="button" class="back-button" onclick="location.href = '{{ url_for('main_routes.select_operation') }}'">返回功能選單</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const filterSupplierNameSelect = document.getElementById('filter_supplier_name');
            const filterProductNameInput = document.getElementById('filter_product_name');
            const filterUnitInput = document.getElementById('filter_unit');
            const filterButton = document.getElementById('filter_button');
            const salesHistoryTableContainer = document.getElementById('salesHistoryTableContainer');
            const salesReturnForm = document.getElementById('salesReturnForm');
            const hiddenOriginalTransactionIdInput = document.getElementById('original_transaction_id');
            const staffSelect = document.getElementById('staff');

            filterButton.addEventListener('click', fetchSalesTransactions);

            function fetchSalesTransactions() {
                const supplierName = filterSupplierNameSelect.value;
                const productName = filterProductNameInput.value.trim();
                const unit = filterUnitInput.value.trim();

                salesHistoryTableContainer.innerHTML = '<p>載入中...</p>';

                let apiUrl = '/api/sales_transactions_for_return?';
                const params = [];
                if (supplierName) params.push(`supplier_name=${encodeURIComponent(supplierName)}`);
                if (productName) params.push(`product_name=${encodeURIComponent(productName)}`);
                if (unit) params.push(`unit=${encodeURIComponent(unit)}`);
                apiUrl += params.join('&');

                fetch(apiUrl)
                    .then(response => {
                        if (!response.ok) {
                            throw new Error(`HTTP error! status: ${response.status}`);
                        }
                        return response.json();
                    })
                    .then(data => {
                        renderSalesHistoryTable(data.transactions);
                    })
                    .catch(error => {
                        console.error('Error fetching sales transactions:', error);
                        salesHistoryTableContainer.innerHTML = `<p style="color: red;">查詢銷售記錄失敗: ${error.message}</p>`;
                    });
            }

            function renderSalesHistoryTable(transactions) {
                if (!transactions || transactions.length === 0) {
                    salesHistoryTableContainer.innerHTML = '<p>找不到符合條件的銷售記錄。</p>';
                    return;
                }

                let tableHtml = `
                    <table class="sales-history-table">
                        <thead>
                            <tr>
                                <th>交易ID</th>
                                <th>日期</th>
                                <th>時間</th>
                                <th>班別</th>
                                <th>產品名稱</th>
                                <th>單位</th>
                                <th>數量</th>
                                <th>單價</th>
                                <th>總價</th>
                                <th>供應商</th>
                                <th>員工</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody>
                `;
                // 確保交易ID (通常是第一個欄位) 也被正確顯示
                // 假設 API 回傳的 transactions 陣列中，每個物件的第一個 key 是交易ID
                // 如果不是，需要從 data_manager.read_transactions 確認返回的欄位
                // 或者假設 transaction_id 欄位總是存在。
                // 根據 models/transactions.py 和 routes/main_routes.py 的 api_sales_transactions_for_return
                // 返回的數據中應該有 transaction_id (如果 read_transactions 有返回)
                // 但 models/data_manager.py -> read_transactions 裡 SELECT 語句是 `SELECT rowid as 交易ID, ...`
                // 所以 transactions 字典裡的鍵名應是 '交易ID'

                transactions.forEach(tx => {
                    tableHtml += `
                        <tr>
                            <td>${tx['交易ID'] || 'N/A'}</td>
                            <td>${tx['日期'] || ''}</td>
                            <td>${tx['時間'] || ''}</td>
                            <td>${tx['班別'] || ''}</td>
                            <td>${tx['產品名稱'] || ''}</td>
                            <td>${tx['單位'] || ''}</td>
                            <td>${tx['數量'] || ''}</td>
                            <td>${tx['單價'] || ''}</td>
                            <td>${tx['總價'] || ''}</td>
                            <td>${tx['供應商'] || ''}</td>
                            <td>${tx['員工'] || ''}</td>
                            <td class="action-cell">
                                <button type="button" class="return-btn" data-txid="${tx['交易ID']}">整單退貨</button>
                            </td>
                        </tr>
                    `;
                });

                tableHtml += `
                        </tbody>
                    </table>
                `;
                salesHistoryTableContainer.innerHTML = tableHtml;

                // 為新生成的按鈕添加事件監聽器
                document.querySelectorAll('.return-btn').forEach(button => {
                    button.addEventListener('click', handleReturnAction);
                });
            }

            function handleReturnAction(event) {
                const transactionId = event.target.dataset.txid;
                if (!transactionId) {
                    alert('錯誤：無法獲取交易ID。');
                    return;
                }

                const selectedStaff = staffSelect.value;
                if (!selectedStaff) {
                    alert('請先在上方選擇處理退貨的員工。');
                    staffSelect.focus();
                    return;
                }

                if (confirm(`確定要將銷售記錄 ID: ${transactionId} 進行整單退貨嗎？\n此操作無法撤銷。`)) {
                    hiddenOriginalTransactionIdInput.value = transactionId;
                    // 員工和原因已經通過表單的 input/select 元素綁定，提交時會一起發送
                    salesReturnForm.submit();
                }
            }
            
            // 頁面載入時，如果 URL 中有篩選參數 (例如從錯誤重導回來時)，可以考慮自動觸發一次查詢
            // 這部分邏輯可以根據需要添加
            // fetchSalesTransactions(); // 初始可以不載入，讓使用者手動查詢

        });
    </script>
</body>
</html>
